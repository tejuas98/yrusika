<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Yrusika Panel</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>

  <!-- Panel Header -->
  <header class="panel-header">
    <div class="brand-title">
      <span>&lsaquo;</span>
      <span>Yrusika</span>
      <span>&rsaquo;</span>
    </div>
    <div class="header-actions">
      <span id="model-badge" class="badge-free" title="Click to configure AI Model">Gemini 2.5 (Active)</span>
      
      <!-- Palette Toggle Button (Portfolio Palettes) -->
      <button class="icon-btn" id="palette-toggle" title="Color Palettes">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>
      </button>

      <!-- Light / Dark Quick Mode Toggle -->
      <button class="icon-btn" id="theme-toggle" title="Toggle Light / Dark Mode">
        <svg id="theme-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>

      <button class="icon-btn" id="close-panel" title="Close Panel">&times;</button>
    </div>
  </header>

  <!-- Exit Video Mode Button -->
  <button id="exit-video-mode" class="exit-video-btn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
    Exit Video Mode
  </button>

  <!-- Notification Banner -->
  <div id="notification-banner" class="notification-banner hidden">
    <div>
      <div style="font-weight: 600;" id="notif-title">Note exported successfully</div>
      <div style="color: var(--text-secondary);" id="notif-desc">Downloaded note</div>
    </div>
    <button class="icon-btn" id="notif-close">&times;</button>
  </div>

  <!-- Vault & Tool Row -->
  <div class="toolbar-row">
    <div id="vault-btn" class="vault-pill" title="Click to link local Obsidian Vault">
      <span class="vault-status-dot"></span>
      <span id="vault-name">Vault: Local (Click to link)</span>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
    </div>

    <div class="toolbar-icons">
      <button class="icon-btn" id="btn-language" title="Language">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      </button>
      <button class="icon-btn" id="btn-new-note" title="New Note">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <button class="icon-btn" id="btn-save" title="Save Note">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      </button>
      <button class="icon-btn" id="btn-export" title="Export Note">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
      </button>
      <button class="icon-btn" id="btn-settings" title="Settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>

      <!-- Export Dropdown Menu -->
      <div id="export-dropdown" class="export-dropdown">
        <button class="export-item" id="export-copy">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copy note (text)
        </button>
        <button class="export-item" id="export-pdf">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          Export as PDF
        </button>
        <button class="export-item" id="export-word">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Export as Word
        </button>
        <button class="export-item" id="export-md">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export as Markdown
        </button>
      </div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs-row">
    <button class="tab-btn active" id="tab-notes">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      Notes
    </button>
    <button class="tab-btn" id="tab-transcript">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      Transcript
    </button>
  </div>

  <!-- Main Note Scroll Area -->
  <main class="note-container" id="note-container">
    <input type="text" id="note-title" class="note-title-input" placeholder="Enter note title" value="Untitled 1">

    <div class="properties-collapsible">
      <div class="properties-header" id="props-toggle">
        <span>▶ Properties</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      </div>
      <div class="properties-content" id="props-content">
        <div style="margin: 4px 0;"><strong>Source:</strong> <span id="prop-source">YouTube Video</span></div>
        <div style="margin: 4px 0;"><strong>Date:</strong> <span id="prop-date">Today</span></div>
        <div style="margin: 4px 0;"><strong>Tags:</strong> #lecture #notes #yrusika</div>
      </div>
    </div>

    <div id="watching-status" class="watching-status-box">
      <div>
        <span class="watching-pulse"></span>
        <span id="watching-text">Yrusika is watching video...</span>
      </div>
      <span id="watching-counter" style="font-family: monospace; font-weight: 600;">0</span>
    </div>

    <!-- Rendered Markdown Notes Content -->
    <div id="note-stream" class="note-content-rendered">
      <!-- Live Cards & Notes appended here -->
    </div>

    <button id="floating-assistant" class="floating-assistant-btn" title="Ask AI about video">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8.01" y2="16"/><line x1="16" y1="16" x2="16.01" y2="16"/></svg>
    </button>
  </main>

  <!-- Bottom Control Dock -->
  <footer class="bottom-dock">
    <div class="dock-group">
      <button class="dock-btn" id="btn-fullscreen" title="Toggle Fullscreen">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
      <button class="dock-btn" id="btn-dock-settings" title="Preferences">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>

    <div class="dock-group">
      <button class="dock-btn" id="btn-timestamp" title="Insert Current Timestamp">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </button>
      <button class="dock-btn" id="btn-snapshot" title="Take Screenshot Frame">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </button>
    </div>

    <div class="dock-group">
      <button class="dock-btn active" id="btn-ai-toggle" title="Toggle AI Auto-Watch">
        <span style="color: var(--primary-brand); font-size: 11px;">●</span> EN ▾
      </button>
      <button class="dock-btn" id="btn-translate-toggle" title="Live Translate">
        <span style="font-size: 11px; font-weight: 600;">文A</span> EN ▾
      </button>
    </div>
  </footer>

  <!-- Color Palette Drawer (Matches Portfolio Design) -->
  <div id="palette-drawer" class="palette-drawer-overlay hidden">
    <div class="palette-drawer-content">
      <div class="palette-drawer-header">
        <div class="palette-header-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>
          <span>Color Palettes</span>
        </div>
        <button class="icon-btn" id="close-palette-drawer">&times;</button>
      </div>

      <!-- Mode & Random Controls -->
      <div class="palette-drawer-controls">
        <button id="palette-mode-toggle" class="palette-ctrl-btn">
          Mode: <span id="current-mode-label">Dark</span>
        </button>
        <button id="palette-random-btn" class="palette-ctrl-btn">
          Surprise Me
        </button>
      </div>

      <!-- Palette Cards List -->
      <div id="palette-cards-list" class="palette-cards-list">
        <!-- Injected via JavaScript from YRUSIKA_THEMES -->
      </div>
    </div>
  </div>

  <script src="themes.js"></script>
  <script src="vision-detector.js"></script>
  <script src="ai-client.js"></script>
  <script src="panel.js"></script>
</body>
</html>
